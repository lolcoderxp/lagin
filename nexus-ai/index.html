<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07070a"><meta name="description" content="Nexus AI — Ultra Chat"><title>Nexus AI — Ultra Chat</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>/* Nexus AI Ultra — polished self-contained build. Full production preview is available as the generated local artifact. */:root{--bg:#07070a;--panel:#0e0f13;--line:#252833;--text:#f7f7fa;--muted:#8f95a3;--accent:#8b5cf6;--accent2:#38bdf8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Vazirmatn,sans-serif;background:radial-gradient(circle at 80% -20%,#8b5cf620,transparent 28%),var(--bg);color:var(--text)}.app{height:100dvh;display:flex}.side{width:280px;border-left:1px solid var(--line);padding:18px;background:#0a0b0f;display:flex;flex-direction:column;gap:14px}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}.mark svg{width:22px;fill:white}.new{height:46px;border-radius:14px;background:linear-gradient(135deg,#171921,#0f1015);color:white;font-weight:700;border:1px solid #ffffff18}.history{display:grid;gap:5px}.history button{padding:11px;border:0;border-radius:11px;background:transparent;color:#aeb3bf;text-align:right}.history button:hover{background:#181a21;color:#fff}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.model{padding:10px 13px;border:1px solid var(--line);background:var(--panel);border-radius:12px;color:#fff}.chat{flex:1;overflow:auto}.hero{max-width:800px;margin:0 auto;padding:10vh 20px;text-align:center}.orb{width:76px;height:76px;margin:auto auto 20px;border-radius:25px;background:linear-gradient(135deg,#181a22,#0e1015);display:grid;place-items:center;box-shadow:0 20px 60px #0008}.orb svg{width:36px;fill:white}.hero h1{font-size:clamp(28px,5vw,50px);margin:0 0 12px}.hero p{color:var(--muted);line-height:2;font-size:13px}.prompts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}.prompt{padding:16px;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:#c7cad2}.prompt b{display:block;color:#fff;margin-bottom:4px}.messages{max-width:900px;margin:auto;padding:24px 18px 150px}.msg{display:flex;gap:10px;margin:15px 0}.bubble{max-width:80%;padding:14px 16px;border-radius:19px;background:var(--panel);border:1px solid var(--line);line-height:2;font-size:13px}.user .bubble{background:#17132a;border-color:#8b5cf633}.composer{position:fixed;bottom:0;right:0;left:280px;padding:12px 18px 18px;background:linear-gradient(180deg,transparent,#07070af5 35%)}form{max-width:900px;margin:auto;border:1px solid #ffffff18;background:#101117;border-radius:22px;padding:8px;display:flex;gap:8px;align-items:end}textarea{flex:1;min-height:44px;max-height:130px;background:transparent;border:0;outline:0;color:white;resize:none;padding:10px;font-family:inherit}.send{width:44px;height:44px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--accent),#6d45e5);color:white}.note{text-align:center;color:#727887;font-size:9px;margin-top:6px}@media(max-width:800px){.side{display:none}.composer{left:0}.prompts{grid-template-columns:1fr}.hero{padding-top:7vh}} </style></head><body><div class="app"><aside class="side"><div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Z"/></svg></div><div>Nexus AI<br><small style="color:#777;font-size:9px">Ultra Intelligence</small></div></div><button class="new" id="new">＋ گفت‌وگوی جدید</button><div style="color:#777;font-size:10px">گفت‌وگوهای اخیر</div><div class="history"><button>ایده‌های خلاقانه برای محصول</button><button>برنامه‌ریزی یک پروژه حرفه‌ای</button><button>نوشتن متن معرفی برند</button><button>تحلیل تجربه کاربری</button></div></aside><main class="main"><header class="top"><div class="model">● &nbsp; Nexus Ultra</div><button id="theme" style="background:transparent;color:#aaa;border:0;font-size:18px">☾</button></header><section class="chat" id="chat"><div class="hero" id="hero"><div class="orb"><svg viewBox="0 0 24 24"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Z"/></svg></div><h1>امروز روی چی کار کنیم؟</h1><p>یک فضای سریع، مینیمال و حرفه‌ای برای فکر کردن، نوشتن، تحلیل کردن و ساختن.</p><div class="prompts"><button class="prompt">ایده‌پردازی<br><small>نام، شعار و کانسپت برند</small></button><button class="prompt">برنامه‌ریزی<br><small>از ایده تا اجرای واقعی</small></button><button class="prompt">نوشتن حرفه‌ای<br><small>محتوا و متن‌های تجاری</small></button><button class="prompt">تحلیل<br><small>UX، محصول و تصمیم‌سازی</small></button></div></div><div class="messages" id="messages"></div></section><div class="composer"><form id="form"><textarea id="input" rows="1" placeholder="پیام خود را بنویسید..."></textarea><button class="send" type="submit">➤</button></form><div class="note">Nexus AI ممکن است اشتباه کند؛ اطلاعات مهم را بررسی کنید.</div></div></main></div><script>const i=document.getElementById('input'),m=document.getElementById('messages'),h=document.getElementById('hero');function add(c,t){const x=document.createElement('div');x.className='msg '+c;x.innerHTML='<div class="bubble"></div>';x.firstElementChild.textContent=t;m.appendChild(x);document.getElementById('chat').scrollTop=999999}document.getElementById('form').onsubmit=e=>{e.preventDefault();let t=i.value.trim();if(!t)return;h.style.display='none';add('user',t);i.value='';setTimeout(()=>add('ai','حتماً. درخواستت را بررسی می‌کنم و یک پاسخ ساختاریافته، حرفه‌ای و قابل اجرا آماده می‌کنم.'),650)};document.querySelectorAll('.prompt').forEach(x=>x.onclick=()=>{i.value=x.textContent.trim();i.focus()});document.getElementById('new').onclick=()=>{m.innerHTML='';h.style.display='block'};document.getElementById('theme').onclick=()=>{document.body.style.filter=document.body.style.filter?'':'invert(.92) hue-rotate(180deg)'};</script></body></html>
